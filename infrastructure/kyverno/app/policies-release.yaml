---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno-policies
  namespace: kyverno
spec:
  interval: 1h
  dependsOn:
    - name: kyverno
  chart:
    spec:
      chart: kyverno-policies
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: kyverno
      version: 3.8.2
  values:
    podSecurityStandard: restricted
