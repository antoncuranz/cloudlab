---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trivy-operator
  namespace: trivy-system
spec:
  interval: 1h
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  chart:
    spec:
      chart: trivy-operator
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: aqua
      version: 0.38.1
  values:
    targetNamespaces: ""
    excludeNamespaces: kube-system,trivy-system
    operator:
      scanJobTTL: 30m
      scanJobTimeout: 10m
      scanJobsConcurrentLimit: 3
      scannerReportTTL: 24h
      vulnerabilityScannerEnabled: true
      configAuditScannerEnabled: true
      rbacAssessmentScannerEnabled: true
      exposedSecretScannerEnabled: true
      # The default node collector assumes conventional Linux host paths.
      # Validate Talos-specific mounts before enabling host assessments.
      infraAssessmentScannerEnabled: false
      clusterComplianceEnabled: false
      metricsFindingsEnabled: true
    trivy:
      ignoreUnfixed: true
      severity: CRITICAL,HIGH,MEDIUM
      mode: Standalone
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 1Gi
    serviceMonitor:
      enabled: true
      interval: 60s
