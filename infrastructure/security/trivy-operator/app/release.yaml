---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trivy-operator
  namespace: trivy-system
spec:
  interval: 1h
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  chart:
    spec:
      chart: trivy-operator
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: aqua
      version: 0.38.1
  values:
    targetNamespaces: ""
    excludeNamespaces: kube-system,trivy-system
    operator:
      # Let the operator delete finished jobs immediately to release their DB cache.
      scanJobTTL: ""
      scanJobTimeout: 10m
      # Each standalone scan downloads and unpacks its own vulnerability DB.
      scanJobsConcurrentLimit: 1
      scanNodeCollectorLimit: 1
      scannerReportTTL: 24h
      vulnerabilityScannerEnabled: true
      configAuditScannerEnabled: true
      rbacAssessmentScannerEnabled: true
      exposedSecretScannerEnabled: true
      infraAssessmentScannerEnabled: true
      clusterComplianceEnabled: true
      metricsFindingsEnabled: true
    trivy:
      ignoreUnfixed: true
      severity: CRITICAL,HIGH,MEDIUM
      mode: Standalone
      configFile:
        cache:
          # Scan containers in a workload job run concurrently and share /tmp.
          # Use a process-local scan cache to avoid BoltDB file-lock contention.
          backend: memory
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
          ephemeralStorage: 2Gi
        limits:
          cpu: 500m
          memory: 1Gi
          ephemeralStorage: 4Gi
    nodeCollector:
      # Replace the conventional Linux mounts with the Talos guide's mount.
      volumeMounts:
        - name: etc-os-release
          mountPath: /host/etc/os-release
          readOnly: true
      volumes:
        - name: etc-os-release
          hostPath:
            path: /etc/os-release
            type: File
    serviceMonitor:
      enabled: true
      interval: 60s
