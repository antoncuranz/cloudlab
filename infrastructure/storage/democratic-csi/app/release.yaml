---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: democratic-csi
  namespace: storage
spec:
  interval: 1h
  chart:
    spec:
      chart: democratic-csi
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: democratic-csi
      version: 0.15.1
  values:
    csiDriver:
      name: "org.democratic-csi.local-hostpath"
      attachRequired: false
      storageCapacity: true
      fsGroupPolicy: File

    storageClasses:
      - name: local-hostpath
        defaultClass: true
        reclaimPolicy: Retain
        volumeBindingMode: WaitForFirstConsumer
        allowVolumeExpansion: false

    volumeSnapshotClasses:
      - name: local-hostpath
        annotations:
          snapshot.storage.kubernetes.io/is-default-class: "true"
        deletionPolicy: Delete
        parameters:
          cluster: "cloudlab"

    csiProxy:
      image:
        registry: ghcr.io/democratic-csi/csi-grpc-proxy
        # renovate: datasource=docker depName=ghcr.io/democratic-csi/csi-grpc-proxy
        tag: v0.5.7

    controller:
      driver:
        image:
          registry: ghcr.io/democratic-csi/democratic-csi
          # renovate: datasource=docker depName=ghcr.io/democratic-csi/democratic-csi
          tag: v1.9.5
      enabled: true
      strategy: node
      externalProvisioner:
        enabled: true
        image:
          registry: registry.k8s.io/sig-storage/csi-provisioner
          # renovate: datasource=docker depName=registry.k8s.io/sig-storage/csi-provisioner
          tag: v6.4.0
        extraArgs:
          - --leader-election=false
          - --node-deployment=true
          - --node-deployment-immediate-binding=false
          - --strict-topology=true
          - --enable-capacity=true
          - --capacity-ownerref-level=1
      externalAttacher:
        enabled: false
      externalResizer:
        enabled: false
      externalSnapshotter:
        enabled: true
        image:
          registry: registry.k8s.io/sig-storage/csi-snapshotter
          # renovate: datasource=docker depName=registry.k8s.io/sig-storage/csi-snapshotter
          tag: v8.7.0
        extraArgs:
          - --leader-election=false
          - --node-deployment=true

    node:
      driverRegistrar:
        image:
          registry: registry.k8s.io/sig-storage/csi-node-driver-registrar
          # renovate: datasource=docker depName=registry.k8s.io/sig-storage/csi-node-driver-registrar
          tag: v2.18.0
      cleanup:
        image:
          registry: docker.io/busybox
          # renovate: datasource=docker depName=docker.io/busybox
          tag: 1.38.0
      driver:
        image:
          registry: ghcr.io/democratic-csi/democratic-csi
          # renovate: datasource=docker depName=ghcr.io/democratic-csi/democratic-csi
          tag: v1.9.5
        extraVolumeMounts:
          - name: local-hostpath
            mountPath: &path "/var/mnt/local-storage"
            mountPropagation: Bidirectional
      extraVolumes:
        - name: local-hostpath
          hostPath:
            path: *path
            type: DirectoryOrCreate

    driver:
      config:
        driver: local-hostpath
        local-hostpath:
          shareBasePath: *path
          controllerBasePath: *path
          dirPermissionsMode: "0770"
          dirPermissionsUser: 0
          dirPermissionsGroup: 0
